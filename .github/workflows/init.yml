name: Init

# Run once from the Actions tab in a repository created from the template.
# Replaces the template's owner and repository name, applies the chosen image name and the
# pytest/mypy/Trivy choices, then opens a pull request.
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Docker image name (lowercase letters, digits, '.', '_' and '-')
        required: true
        type: string
      dockerhub_namespace:
        description: Docker Hub user or organisation (optional; defaults to DOCKERHUB_USERNAME)
        required: false
        type: string
      with_pytest:
        description: Keep the pytest image tests
        type: boolean
        default: true
      with_mypy:
        description: Keep strict mypy type checking
        type: boolean
        default: true
      with_trivy:
        description: Keep Trivy security scanning of the Dockerfile and image
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  init:
    name: Initialize repository
    if: github.repository != 'coldsofttech/docker-public-repo-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Replace owner and repository name
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          git ls-files -z -- . \
            ':(exclude).github/workflows' ':(exclude)LICENSE' ':(exclude).pre-commit-config.yaml' \
            | xargs -0 grep -lZ -e coldsofttech -e docker-public-repo-template \
            | xargs -0 -r sed -i \
                -e "s|coldsofttech/docker-public-repo-template|$REPO|g" \
                -e "s|docker-public-repo-template|$NAME|g" \
                -e "s|coldsofttech|$OWNER|g"

      - name: Apply image name and tooling choices
        env:
          REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image_name }}
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          WITH_PYTEST: ${{ inputs.with_pytest }}
          WITH_MYPY: ${{ inputs.with_mypy }}
          WITH_TRIVY: ${{ inputs.with_trivy }}
        run: python3 scripts/init_template.py

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/init-template
          # The workflow token can't push changes to .github/workflows (needs a PAT), so skip them.
          if ! git diff --quiet -- .github/workflows; then
            git checkout -- .github/workflows
            echo "::warning title=Workflow changes skipped::GitHub does not let the workflow token change files in .github/workflows, so those edits were left out of the pull request. Run scripts/init_template.py locally with IMAGE_NAME, REPO and the WITH_* variables set to apply them."
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "chore: initialize repository from template"
          git push origin chore/init-template
          gh pr create --base "$BASE" --head chore/init-template \
            --title "chore: initialize repository from template" \
            --body "Replaces the template owner and repository name, and applies the image name and the pytest/mypy choices. Review, merge, then delete \`.github/workflows/init.yml\`."
